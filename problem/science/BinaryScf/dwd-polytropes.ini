# Compact n=3/2 polytropic proxies with ideal-gas evolution.
# No cold-degeneracy EOS or enforced WD mass-radius relation.
problem.name = binary-scf
scf.primaryMass = 1.193082e33
scf.massRatio = 0.7
scf.separation = 3e9
scf.primary.coreIndex = 1.5
scf.primary.envelopeIndex = 1.5
scf.primary.densityJump = 1
scf.donor.coreIndex = 1.5
scf.donor.envelopeIndex = 1.5
scf.donor.densityJump = 1
scf.primary.fill = 0.9
scf.donor.fill = 1
scf.cells = 64
runtime.stopTime = 0
output.directory = output/binary-dwd-polytropes
