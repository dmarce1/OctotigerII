# q=0.7 ideal-gas n=3/2 white-dwarf proxies, donor at L1.
# Shared K; its dimensional value is set by the requested mass and separation.
problem.name = binary-scf
scf.primaryMass = 1.193082e33
scf.massRatio = 0.7
scf.separation = 3e9
scf.primary.coreIndex = 1.5
scf.primary.envelopeIndex = 1.5
scf.primary.densityJump = 1
scf.donor.coreIndex = 1.5
scf.donor.envelopeIndex = 1.5
scf.donor.densityJump = 1
scf.commonPolytropicK = on
scf.donor.fill = 1

# The reference contains the stars; the evolution box spans twelve separations.
scf.referenceWidth = 2
scf.cells = 128
mesh.lower = -1.8e10
mesh.upper = 1.8e10
mesh.cells = 8
mesh.level = 2
amr.enabled = on
amr.minLevel = 2
amr.maxLevel = 7
amr.shadowTolerance = 0
amr.maxCellMass = 0
# amr.refineDensity defaults to 1% of the maximum SCF central density.

# A first interactive run of 0.2 initial orbits writes 21 timed frames.
scf.evolveOrbits = 0.2
scf.framesPerOrbit = 100
output.enabled = on
output.directory = output/qb4-dwd
