# Four-node diagnostic: 3D column extension of the stationary Gresho-Chan vortex.
problem.name=gresho
mesh.cells=8
mesh.level=2
amr.enabled=on
amr.minLevel=2
amr.maxLevel=3
amr.refineSpeed=0.9
amr.shadowTolerance=0
amr.regridEvery=1
amr.bufferCells=0
timestep.refinement=on
timestep.coarseLevel=0
runtime.progressLevel=3
# Short first run; literature comparison endpoint is t=3.
runtime.stopTime=0.02
verification.analytic=on
radiation.enabled=off
output.every=5
output.directory=output/gresho-qb4
