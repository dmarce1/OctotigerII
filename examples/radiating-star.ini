problem.name=radiatingStar
# Uniformly rotating, stably stratified gas+radiation SCF interior.
star.centralDensity=1
star.polytropicIndex=3.5
star.atmosphereFraction=1e-12
radiatingStar.centralGasFraction=0.8
radiatingStar.rotationFraction=0.2
radiatingStar.radialCells=256
radiatingStar.angularPoints=32
radiatingStar.multipoles=12
hydro.gamma=1.6666666666666667
hydro.meanMolecularWeight=0.6
# Physical light speed, constant gray absorption, no imposed photon source.
radiation.lightSpeedRatio=1
radiation.opacity=0.34
radiation.closedBoundary=on
frame.omega=0
mesh.cells=8
mesh.level=1
amr.enabled=on
amr.minLevel=1
amr.maxLevel=4
amr.refineDensity=0.001
amr.shadowTolerance=0
amr.maxCellMass=0
amr.regridEvery=1
amr.bufferCells=1
timestep.refinement=on
gravity.timeIntegration=hierarchical
gravity.energyTreatment=mullen
gravity.conserveRegridEnergy=on
# Short startup check (~0.1 dynamical time); use longer runs for stability evidence.
runtime.stopTime=2400
verification.directSamples=32
output.directory=output/radiating-star
output.every=10
