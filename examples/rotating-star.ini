problem.name=rotatingStar
# Original Octo-Tiger oblate SCF model, scaled to CGS.
# Here star.radius is the length unit; the equatorial radius is about 0.905e9 cm.
star.radius=1e9
star.centralDensity=1e6
star.center.x=0
star.center.y=0
star.center.z=0
star.atmosphereFraction=1e-10
# Stellar spin is fixed by the SCF model and density scale. The grid corotates.
frame.omega=0.13319147161856015
mesh.cells=4
mesh.level=1
amr.enabled=on
amr.minLevel=1
amr.maxLevel=3
amr.shadowTolerance=0
amr.maxCellMass=0
amr.refineDensity=1e4
amr.regridEvery=1
amr.bufferCells=1
timestep.refinement=on
gravity.timeIntegration=hierarchical
gravity.energyTreatment=mullen
gravity.conserveRegridEnergy=on
# Short initial check; one stellar rotation is 47.17408127431507 seconds.
runtime.stopTime=2.50
verification.directSamples=32
output.directory=output/rotating-star
output.every=1
