problem.name=polytrope
# CGS. Unless mesh.lower/upper are specified, the box is [-2R,+2R].
star.radius=1e9
# Coordinates in cm; omitted axes default to the box midpoint.
star.center.x=0
star.center.y=0
star.center.z=0
star.centralDensity=1e6
star.polytropicIndex=1.5
star.atmosphereFraction=1e-8
# hydro.gamma defaults to 1+1/n. It can be set independently for stability studies.
mesh.cells=4
mesh.level=1
amr.enabled=on
amr.minLevel=1
amr.maxLevel=3
amr.shadowTolerance=0
amr.maxCellMass=0
# Density threshold defaults to 0.01*star.centralDensity; override in g/cm^3:
# amr.refineDensity=1e4
amr.regridEvery=1
amr.bufferCells=1
runtime.stopTime=10
verification.directSamples=32
output.directory=output/polytrope
output.every=1
