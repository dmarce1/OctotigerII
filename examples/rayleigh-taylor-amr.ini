# Rayleigh-Taylor with an independently evolved shadow refinement criterion.
# Requires the 3D Rayleigh-Taylor build. Dimensional values are CGS.
# Transverse boundaries are periodic; both vertical boundaries reflect.
mesh.cells=8
mesh.level=1
mesh.lower=-0.5
mesh.upper=0.5
amr.enabled=on
amr.minLevel=1
amr.maxLevel=3
amr.regridEvery=4
amr.shadowTolerance=0.05
amr.shadowFloor=1e-8
amr.maxCellMass=0
amr.coarsenFactor=0.25
amr.signalBuffer=1.25
amr.bufferCells=1
runtime.stopTime=10
hydro.gamma=1.4
rayleighTaylor.densityLower=1
rayleighTaylor.densityUpper=2
rayleighTaylor.interfacePressure=2.5
rayleighTaylor.perturbation=0.01
output.enabled=on
output.directory=output/rayleigh-taylor-amr
output.every=50
