# Nonrotating control for the rotating radiation-star benchmark.
# Full M1 radiation, coupled gas energy/momentum, and isolated self-gravity.
problem.name=radiating-sphere
star.centralDensity=1
star.polytropicIndex=3.5
star.atmosphereFraction=1e-12
radiatingStar.centralGasFraction=0.8
radiatingStar.rotationFraction=0
radiatingStar.opticalDepthScale=240
radiatingStar.opacityCutoffFraction=0.016
radiatingStar.structureTolerance=1e-9
# The surface is at 6.39416443 alpha; alpha = 1.49191e11 cm here.
# The opacity is a fixed spatial profile, zero outside its matching radius.
# The positive photon heater is also fixed, never an equilibrium reset.
mesh.cells=8
mesh.level=1
amr.enabled=on
amr.minLevel=1
amr.maxLevel=4
amr.shadowTolerance=0
amr.refineDensity=0.001
amr.regridEvery=4
timestep.refinement=on
gravity.timeIntegration=hierarchical
gravity.energyTreatment=mullen
gravity.conserveRegridEnergy=on
radiation.lightSpeedRatio=1
# A short first check, not a long-term stability experiment.
runtime.stopTime=10
verification.directSamples=32
output.directory=output/radiating-sphere
output.every=10
