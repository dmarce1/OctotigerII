# Rotating carbon/oxygen white dwarf with cold degenerate electrons, thermal ions,
# isolated self-gravity, and full-speed M1 radiation.
problem.name=radiatingWhiteDwarf
star.centralDensity=1e9
star.atmosphereFraction=1e-12
hydro.eos=white-dwarf
hydro.gamma=1.6666666666666667
hydro.meanMolecularWeight=14
hydro.meanMassPerElectron=2
hydro.dualEnergy.enabled=on
whiteDwarf.thermalPressureFraction=1e-4
whiteDwarf.rotationFraction=0.2
whiteDwarf.radialCells=256
whiteDwarf.angularPoints=32
whiteDwarf.multipoles=12
radiation.lightSpeedRatio=1
# Gray absorption is a controlled approximation, not a detailed WD opacity.
radiation.opacity=0.2
radiation.closedBoundary=on
frame.omega=0
mesh.cells=8
mesh.level=1
amr.enabled=on
amr.minLevel=1
amr.maxLevel=4
amr.refineDensity=1e6
amr.shadowTolerance=0
amr.regridEvery=1
timestep.refinement=on
gravity.timeIntegration=hierarchical
gravity.energyTreatment=mullen
gravity.conserveRegridEnergy=on
# Around 0.1 of the nonrotating dynamical time at this central density.
runtime.stopTime=0.03
verification.directSamples=32
output.directory=output/radiating-white-dwarf
output.every=10
