[problem]
name = radiation-matter
[radiation]
# Analytic fully ionized free-free absorption and elastic electron scattering.
# Suitable as a gray-method test, not a calibrated stellar opacity.
opacityModel = ionized-gas
hydrogenFraction = 0.7
metalFraction = 0.02
lightSpeedRatio = 1
diagnosticLength = 1e8
initialEnergyRatio = 0.5
[runtime]
stopTime = 0.001
[output]
directory = output-radiation-matter-ionized
every = 5
