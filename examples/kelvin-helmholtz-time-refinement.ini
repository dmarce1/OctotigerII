problem.name=kelvin-helmholtz
# Periodic 2D shear layer with mixed spatial levels and evolved-shadow AMR.
mesh.cells=8
mesh.level=2
mesh.periodic=on

amr.enabled=on
amr.minLevel=2
amr.maxLevel=3
amr.refineDensity=1.9
amr.maxCellMass=0
amr.shadowTolerance=0.8
amr.shadowFloor=1e-8
amr.regridEvery=2
amr.bufferCells=0

timestep.refinement=on
runtime.stopTime=0.02
output.directory=output/kelvin-helmholtz-time-refinement-demo
output.every=1
